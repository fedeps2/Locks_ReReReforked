modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="Melonslise, Kaleb Langley, Yuqi154"
logoFile="icon.png"
logoBlur=false

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="locks.mixins.json"

[[mixins]]
config="locks.mixins.compact.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lootr"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5,)"
ordering="AFTER"
side="BOTH"
